      - in: query
        name: resource_type
        schema:
          type: string
          enum:
          - INTERNAL
          - EXTERNAL
      - in: query
        name: q
        schema:
          type: string
        description: Case-insensitive name-snapshot substring.
      - in: query
        name: evidence
        schema:
          type: string
          enum:
