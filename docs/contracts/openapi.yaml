      operationId: profiles_me_retrieve
      description: 'Permission: Any active member; own-profile data only. '
      tags:
      - profiles
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Read my profile and upload status
    post:
      operationId: profiles_me_create
      description: 'Permission: Any active member; own-profile data only. '
      tags:
      - profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateProfile'
      security:
      - cookieAuth: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
        '400':
          description: Invalid input, unsupported decision, or refused operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '409':
          description: 'State conflict: locked/closed/already performed, or reused idempotency key with
            a different project or payload.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Create my external profile
    patch:
      operationId: profiles_me_partial_update
      description: 'Permission: Any active member; own-profile data only. '
      tags:
      - profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCandidateProfile'
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
        '400':
          description: Invalid input, unsupported decision, or refused operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Edit my candidate fields
  /api/profiles/me/claims/:
    get:
      operationId: profiles_me_claims_retrieve
      tags:
      - profiles
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
