          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: List my structured skill claims
      description: 'Permission: Any active member; own-profile data only. '
    post:
      operationId: profiles_me_claims_create
      tags:
      - profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormClaimInput'
      security:
      - cookieAuth: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillClaim'
        '400':
          description: Invalid input, unsupported decision, or refused operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Confirm a form skill claim
      description: 'Permission: Any active member; own-profile data only. Uses a skill name or alias,
        not its numeric ID. A confirmed form claim is self-reported; this does not accept PDF evidence.'
  /api/profiles/me/data-requests/:
    post:
      operationId: profiles_me_data_requests_create
      description: 'Permission: Any active member; own-profile data only. Records a request for staff
        action; it does not delete data.'
      tags:
      - profiles
      security:
      - cookieAuth: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataRequestCreated'
        '400':
          description: Invalid input, unsupported decision, or refused operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Record a correction or deletion request
      requestBody:
        required: true
        content:
          application/json:
            schema:
