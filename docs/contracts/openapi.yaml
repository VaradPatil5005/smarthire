  /api/profiles/me/resumes/:
    get:
      operationId: profiles_me_resumes_retrieve
      tags:
      - profiles
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CandidateUpload'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: List my upload versions
      description: 'Permission: Any active member; own-profile data only. '
    post:
      operationId: profiles_me_resumes_create
      tags:
      - profiles
      security:
      - cookieAuth: []
      responses:
        '202':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAccepted'
        '400':
          description: Invalid input, unsupported decision, or refused operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Upload a new PDF version for scanning
      description: 'Permission: Any active member; own-profile data only. PDF only; at most 5 MiB and
        10 pages. Server assigns private names and quarantines input. Poll /api/resumes/{id}/; a failed
        replacement preserves earlier versions.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
  /api/projects/:
    get:
      operationId: projects_list
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: List projects
      description: 'Permission: Staff (RECRUITER, DELIVERY_MANAGER or ADMIN). '
    post:
      operationId: projects_create
      tags:
      - projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      security:
      - cookieAuth: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid input, unsupported decision, or refused operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Create a project
      description: 'Permission: Staff (RECRUITER, DELIVERY_MANAGER or ADMIN). '
  /api/projects/{id}/:
    get:
      operationId: projects_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
