openapi: 3.0.3
info:
  title: SmartHireAI API
  version: 0.1.0
  description: 'Evidence-locked project-to-talent matching. This approved contract documents existing
    views, not planned features. Authenticate through the HTML /login/ form; there is no token-login API.
    All listed operations require an active Django session and membership. Unsafe requests also require
    Django CSRF validation (csrfmiddlewaretoken form field or X-CSRFToken header with the token supplied
    by an HTML form; the CSRF cookie is HttpOnly). No organisation, owner or role provided in a payload
    grants access: organisation is derived from request.membership. For callers with the required role,
    cross-organisation object IDs return 404. Session authentication without valid credentials returns
    403. Scores are stored outputs from Scoring Rule v1.1, not LLM outputs. Decimal score strings must
    be displayed as returned. Candidate-readable statuses intentionally conceal whether a resume was flagged.
    Error responses may use detail or field-specific messages.'
paths:
  /api/imports/:
    get:
      operationId: imports_list
      tags:
      - imports
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportSummary'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: List import batches
      description: 'Permission: ADMIN only. '
    post:
      operationId: imports_create
      tags:
      - imports
      security:
      - cookieAuth: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          description: Invalid input, unsupported decision, or refused operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Preview a synthetic or authorised CSV/XLSX import
      description: 'Permission: ADMIN only. Dry run; writes no profiles. UTF-8 CSV or XLSX, at most 5
        MiB and 5000 rows. Recognised ID and name columns are mandatory. Source keys identify records;
        names/contact fields never auto-merge people.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                source_system:
                  type: string
                  minLength: 1
              required:
              - file
              - source_system
  /api/imports/{id}/:
    get:
      operationId: imports_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - imports
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Read import validation rows and change history
      description: 'Permission: ADMIN only. '
  /api/imports/{id}/confirm/:
    post:
      operationId: imports_confirm_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - imports
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatch'
        '400':
          description: Invalid input, unsupported decision, or refused operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '409':
          description: 'State conflict: locked/closed/already performed, or reused idempotency key with
            a different project or payload.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Confirm a preview import
      description: 'Permission: ADMIN only. '
  /api/imports/{id}/rollback/:
    post:
      operationId: imports_rollback_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - imports
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRollback'
        '400':
          description: Invalid input, unsupported decision, or refused operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '409':
          description: 'State conflict: locked/closed/already performed, or reused idempotency key with
            a different project or payload.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Roll back a confirmed import
      description: 'Permission: ADMIN only. Archives created profiles. Reverts a field only while it still
        equals the imported value; later manual edits are retained.'
  /api/imports/queue/:
    get:
      operationId: imports_queue_retrieve
      tags:
      - imports
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportQueueRow'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: List identity collisions requiring a human choice
      description: 'Permission: ADMIN only. '
  /api/imports/queue/{id}/resolve/:
    post:
      operationId: imports_queue_resolve_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - imports
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportQueueResolved'
        '400':
          description: Invalid input, unsupported decision, or refused operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Resolve one identity-review row
      description: 'Permission: ADMIN only. Only a confirmed batch with a still-queued row can be resolved.
        LINK selects an existing profile without merging fields; CREATE creates another person; SKIP makes
        no profile change.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - LINK
                  - CREATE
                  - SKIP
              required:
              - action
  /api/profiles/:
    get:
      operationId: profiles_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - profiles
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProfileList'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: List active profiles in this organisation
      description: 'Permission: Staff (RECRUITER, DELIVERY_MANAGER or ADMIN). '
    post:
      operationId: profiles_create
      tags:
      - profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Profile'
      security:
      - cookieAuth: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid input, unsupported decision, or refused operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Create a profile
      description: 'Permission: Staff (RECRUITER, DELIVERY_MANAGER or ADMIN). '
  /api/profiles/{id}/:
    get:
      operationId: profiles_retrieve
      description: 'Permission: Staff; a candidate can read only their own profile. '
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - profiles
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Profile'
                - $ref: '#/components/schemas/CandidateProfile'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Read an accessible profile
    patch:
      operationId: profiles_partial_update
      description: 'Permission: Staff; candidate may edit only own candidate fields. Candidate cannot
        set type, allocation, available-from, owner, source IDs or organisation.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - profiles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/PatchedProfile'
              - $ref: '#/components/schemas/PatchedCandidateProfile'
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/Profile'
                - $ref: '#/components/schemas/CandidateProfile'
        '400':
          description: Invalid input, unsupported decision, or refused operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Edit an accessible profile
  /api/profiles/{id}/evidence/:
    get:
      operationId: profiles_evidence_retrieve
      description: 'Permission: Staff (RECRUITER, DELIVERY_MANAGER or ADMIN). '
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - profiles
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvidenceSpan'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: List provisional and reviewed skill evidence
    post:
      operationId: profiles_evidence_create
      description: 'Permission: Staff (RECRUITER, DELIVERY_MANAGER or ADMIN). '
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - profiles
      security:
      - cookieAuth: []
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDecision'
        '400':
          description: Invalid input, unsupported decision, or refused operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Record a human evidence decision before a run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
  /api/profiles/{id}/resumes/:
    post:
      operationId: profiles_resumes_create
      description: 'Permission: Staff (RECRUITER, DELIVERY_MANAGER or ADMIN). PDF only; at most 5 MiB
        and 10 pages. Server assigns private names and quarantines input. Poll /api/resumes/{id}/; a failed
        replacement preserves earlier versions.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - profiles
      security:
      - cookieAuth: []
      responses:
        '202':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAccepted'
        '400':
          description: Invalid input, unsupported decision, or refused operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Authentication, membership, role or CSRF check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: No accessible object exists (including another organisation).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
      summary: Upload a new PDF version for scanning
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
  /api/profiles/me/:
